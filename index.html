<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#eef1fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0f1f" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="StudySpace: kelola tugas kuliah, deadline, jadwal, catatan, dan progres semester." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>StudySpace</title>
    <script>
      try {
        var t = localStorage.getItem('studyspace.theme')
        if (t) t = JSON.parse(t)
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
